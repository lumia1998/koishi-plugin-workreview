<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动日报</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Patrick+Hand&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>${inlineStyle}</style>
</head>
<body>
    <div class="container">

        <!-- 头部 -->
        <div class="header">
            <div class="title-sticker">
                <div class="date-badge">${date}</div>
                <h1>活动日报</h1>
                <div class="device-sticker">
                    <svg class="device-icon" viewBox="0 0 24 24" fill="none">
                        <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span class="device-label">${deviceName}</span>
                </div>
            </div>
        </div>

        <!-- 24H 活跃图表 -->
        <div class="chart-section">
            <div class="chart-header">
                <div class="chart-title">
                    <svg class="doodle" viewBox="0 0 24 24">
                        <path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>
                    </svg>
                    24H 活跃轨迹
                </div>
            </div>
            ${activityChart}
            <div class="chart-legend">${appLegend}</div>
        </div>

        <!-- 活动分类饼图 -->
        <div class="category-section">
            <div class="chart-title">
                <svg class="doodle" viewBox="0 0 24 24">
                    <path d="M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2.03 0v8.99H22c-.47-4.74-4.24-8.52-8.97-8.99zm0 11.01V22c4.74-.47 8.5-4.25 8.97-8.99h-8.97z"/>
                </svg>
                活动占比
            </div>
            ${categoryPieChart}
        </div>

        <!-- 应用时长 Top 5 -->
        <div class="top-apps-section">
            <div class="top-apps-title">应用时长 Top 5</div>
            ${topAppsWithComments}
        </div>

        <!-- 浏览足迹 Top 5 -->
        <div class="browser-section">
            <div class="top-apps-title">
                <svg class="doodle" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                浏览足迹 Top 5
            </div>
            ${browserSites}
        </div>

        <!-- 总结 -->
        <div class="summary-note">
            <div class="pin"></div>
            <div class="section-title">${summaryTitle}</div>
            ${summary}
        </div>

        <!-- 页脚 -->
        <div class="footer">
            Generated by Work_Review · Koishi · ChatLuna
        </div>

    </div>
</body>
</html>
