<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动日报</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Patrick+Hand&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>${inlineStyle}</style>
</head>
<body>
    <div class="container">

        <!-- 头部 -->
        <div class="header">
            <div class="title-sticker">
                <div class="tape"></div>
                <h1>${deviceName}</h1>
                <div class="subtitle">Activity Report</div>
                <div class="date-badge">${date}</div>
            </div>
            <div class="duration-badge">
                <svg class="doodle" viewBox="0 0 24 24">
                    <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                </svg>
                <span class="duration-text">活动时长 ${totalDuration}</span>
            </div>
        </div>

        <!-- 24H 活跃图表 -->
        <div class="chart-section">
            <div class="chart-header">
                <div class="chart-title">
                    <svg class="doodle" viewBox="0 0 24 24">
                        <path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>
                    </svg>
                    24H 活跃轨迹
                </div>
            </div>
            ${activityChart}
            <div class="chart-legend">${appLegend}</div>
        </div>

        <!-- 活动分类饼图 -->
        <div class="category-section">
            <div class="chart-title">
                <svg class="doodle" viewBox="0 0 24 24">
                    <path d="M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2.03 0v8.99H22c-.47-4.74-4.24-8.52-8.97-8.99zm0 11.01V22c4.74-.47 8.5-4.25 8.97-8.99h-8.97z"/>
                </svg>
                活动占比
            </div>
            ${categoryPieChart}
        </div>

        <!-- 应用时长 Top 5 -->
        <div class="top-apps-section">
            <div class="top-apps-title">应用时长 Top 5</div>
            ${topAppsWithComments}
        </div>

        <!-- 总结 -->
        <div class="summary-note">
            <div class="pin"></div>
            <div class="section-title">${summaryTitle}</div>
            ${summary}
        </div>

        <!-- 页脚 -->
        <div class="footer">
            Generated by Work_Review · Koishi · ChatLuna
        </div>

    </div>
</body>
</html>
