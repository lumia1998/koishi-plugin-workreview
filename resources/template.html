<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动日报</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Patrick+Hand&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>${inlineStyle}</style>
</head>
<body>
    <div class="container">

        <!-- 头部 -->
        <div class="header">
            <div class="title-sticker">
                <div class="tape"></div>
                <h1>${deviceName}</h1>
                <div class="subtitle">Activity Report</div>
                <div class="date-badge">${date}</div>
            </div>
        </div>

        <!-- 统计邮票 -->
        <div class="stats-grid">
            <div class="stamp">
                <svg class="doodle stamp-icon" style="color: var(--accent-orange);" viewBox="0 0 24 24">
                    <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                </svg>
                <div class="stamp-num">${totalDuration}</div>
                <div class="stamp-label">总工作时长</div>
            </div>
            <div class="stamp">
                <svg class="doodle stamp-icon" style="color: var(--color-green);" viewBox="0 0 24 24">
                    <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                </svg>
                <div class="stamp-num">${screenshotCount}</div>
                <div class="stamp-label">截图数量</div>
            </div>
            <div class="stamp">
                <svg class="doodle stamp-icon" style="color: var(--color-blue);" viewBox="0 0 24 24">
                    <path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/>
                </svg>
                <div class="stamp-num">${appCount}</div>
                <div class="stamp-label">应用数量</div>
            </div>
            <div class="stamp">
                <svg class="doodle stamp-icon" style="color: var(--color-purple);" viewBox="0 0 24 24">
                    <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .68-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/>
                </svg>
                <div class="stamp-num">${websiteCount}</div>
                <div class="stamp-label">网站数量</div>
            </div>
        </div>

        <!-- 应用排行 -->
        <div class="app-ranking">
            <div class="paper-holes">
                <div class="hole"></div>
                <div class="hole"></div>
                <div class="hole"></div>
            </div>
            <div class="section-title">
                <svg class="doodle" viewBox="0 0 24 24">
                    <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                </svg>
                应用排行 App Ranking
            </div>
            ${topApps}
        </div>

        <!-- 24H 活跃图表 -->
        <div class="chart-section">
            <div class="chart-header">
                <svg class="doodle" viewBox="0 0 24 24">
                    <path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>
                </svg>
                24H 活跃轨迹
            </div>
            ${activeHoursChart}
        </div>

        <!-- 总结 -->
        <div class="summary-note">
            <div class="pin"></div>
            <div class="section-title">${summaryTitle}</div>
            <p>${summary}</p>
        </div>

        <!-- 页脚 -->
        <div class="footer">
            Generated by Work_Review · Koishi · ChatLuna
        </div>

    </div>
</body>
</html>
